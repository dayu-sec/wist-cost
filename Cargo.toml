[workspace]
resolver = "2"
members = ["crates/cost-core", "crates/cost-store", "crates/cost-app"]

[workspace.package]
version = "0.2.0" #@gxl:set(version)
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
cost-core = { path = "crates/cost-core" }
cost-store = { path = "crates/cost-store" }

anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "chrono",
    "json",
    "macros",
    "migrate",
] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "fs"] }
